<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6a8c5">
  <title>Page not found | Mochiko</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .not-found {
      position: relative;
      display: grid;
      min-height: 100svh;
      grid-template-columns: minmax(17rem, 0.8fr) minmax(22rem, 1.2fr);
      align-items: center;
      gap: clamp(1rem, 5vw, 6rem);
      width: min(100%, 90rem);
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 5rem);
      overflow: hidden;
    }

    .not-found__copy { position: relative; z-index: 2; }

    .not-found__code {
      display: block;
      margin-bottom: 1rem;
      color: var(--primary-strong);
      font-family: var(--display-font);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .not-found h1 {
      margin: 0;
      font-family: var(--display-font);
      font-size: clamp(4rem, 9vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.07em;
      line-height: 0.84;
      text-transform: uppercase;
    }

    .not-found p {
      max-width: 31rem;
      margin: 2rem 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.4vw, 1.2rem);
    }

    .not-found__art {
      position: relative;
      align-self: stretch;
      min-height: 38rem;
      border: 1px solid var(--foreground);
      background: var(--primary);
      overflow: hidden;
    }

    .not-found__art::before {
      position: absolute;
      inset: 1rem;
      border: 1px dashed rgba(23, 19, 26, 0.4);
      content: "";
    }

    .not-found__art img {
      position: absolute;
      right: -8%;
      bottom: -2%;
      width: 108%;
      height: 96%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(1rem 1rem 0 rgba(23, 19, 26, 0.12));
    }

    .not-found__art span {
      position: absolute;
      z-index: 2;
      top: 1.5rem;
      left: 1.5rem;
      font-family: var(--display-font);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    @media (max-width: 48rem) {
      .not-found {
        grid-template-columns: 1fr;
        padding-top: 6rem;
      }

      .not-found__art { min-height: min(37rem, 120vw); }
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found__copy">
      <span class="not-found__code">ERROR 404 · LOST PAGE</span>
      <h1>Wrong<br>rabbit hole.</h1>
      <p>This page slipped away. Head back home to find Mochiko's streams, videos, schedule, and official links.</p>
      <a class="button button--dark" href="/">
        <span>Back home</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="not-found__art">
      <span>MOCHIKO · OFFICIAL</span>
      <img src="/assets/about.webp" alt="Mochiko holding a white bunny plush" width="900" height="1200">
    </div>
  </main>
</body>
</html>
